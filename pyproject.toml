[project]
name = "gramme"
version = "0.1.0"
description = "Coût matière pour la restauration et les métiers de bouche"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # >=2.9 : requis pour les génériques PEP 695 (class Extracted[T])
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "factur-x>=7.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6.9",
    "pre-commit>=3.8",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gramme"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra : affiche la raison des tests ignorés. Sans ça, « 94 passed, 14 skipped »
# avec Docker éteint se lit comme un succès complet.
addopts = "-q -ra"
