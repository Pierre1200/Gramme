# =============================================================================
#  Les fournisseurs et leurs catalogues
# =============================================================================
# delivery    : jours de livraison ; every = une livraison toutes les N semaines.
# pricing     : "market" = cours du jour, le prix bouge à chaque facture ;
#               "list"   = tarif, révisé le premier du mois.
#
# Un produit :
#   ref        référence article du fournisseur (absente chez le primeur)
#   label      libellé tel qu'imprimé sur la facture
#   ingredient l'ingrédient qu'il fournit ; absent = hors recettes
#   sold_by    unité de facturation imprimée (KG, PCE, CT, SAC, BID, SEAU...)
#   contains   quantité d'unité de base dans UNE unité facturée
#   price      prix HT d'une unité facturée À LA DATE DE FIN du jeu : c'est le
#              prix réel relevé, appliqué tel quel la dernière semaine. Les
#              trajectoires décrivent le chemin pour y arriver, elles ne le
#              déplacent pas.
#   src        source du prix (voir [sources])
#   proxy      le produit coté quand il n'est pas exactement celui-ci
#   vat        taux de TVA, en pourcentage
#   weight     "variable" = pesé à la livraison, quantité à trois décimales
#   trend, season   trajectoire de prix (voir plus haut)
#   share      part des achats de l'ingrédient, quand deux fournisseurs le vendent
#   relabel    le libellé change en cours d'année ; `label` est le plus récent
#   per_week   pour un produit hors recettes : unités achetées par semaine
#   deposit    consigne facturée à la livraison, déduite au retour

