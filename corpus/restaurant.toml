# =============================================================================
#  L'établissement fictif du jeu d'essai
# =============================================================================
#
# Tout ce fichier est inventé : l'établissement, ses fournisseurs, leurs prix.
# Il est la source unique du jeu de factures factices (`make corpus`) : la
# simulation en tire les ventes, les commandes, puis les factures.
#
# Les noms de champs sont en anglais (règle du dépôt) ; les valeurs — noms de
# plats, libellés, identifiants d'ingrédients — restent en français, comme sur
# une vraie carte et de vraies factures.
#
# Identifiants fictifs par construction :
#   - les SIREN échouent volontairement au contrôle de Luhn, qu'un vrai SIREN
#     passe toujours : ils ne peuvent désigner aucune entreprise existante ;
#   - les téléphones sont pris dans les tranches que l'Arcep réserve à la
#     fiction (05 36 49 .. ..) ;
#   - les adresses électroniques utilisent le domaine réservé `.example`.

[establishment]
name    = "Maison Trébuchet"
tagline = "Restaurant · Traiteur · Pâtisserie"
legal   = "SARL Maison Trébuchet"
street  = "3 impasse du Jeu-d'Essai"
zip     = "31000"
city    = "Toulouse"
siren   = "900000011"
phone   = "05 36 49 00 10"
email   = "contact@maison-trebuchet.example"

[simulation]
seed   = 2026
months = 12
# Part des factures renvoyées une seconde fois, à l'identique : c'est ce que
# l'empreinte SHA-256 doit reconnaître.
duplicate_rate = 0.01
# Fermetures annuelles (mois-jour, bornes incluses) : aucune vente, aucune
# livraison.
closures = [["08-03", "08-17"], ["12-24", "01-02"]]


# =============================================================================
#  Les trois activités
# =============================================================================
# weekdays : poids relatif de chaque jour, du lundi au dimanche (0 = fermé).
# months   : poids relatif de chaque mois, de janvier à décembre.
# lumpy    : true = vendu par lots entiers sur quelques jours (une commande
#            traiteur), false = ventes étalées chaque jour ouvert.

[activities.restaurant]
name     = "Restaurant"
weekdays = [0.0, 0.9, 0.9, 1.0, 1.2, 1.3, 0.0]
months   = [0.9, 0.9, 1.0, 1.0, 1.05, 1.1, 1.0, 0.9, 1.05, 1.0, 1.0, 1.1]
lumpy    = false

[activities.traiteur_sale]
name     = "Traiteur salé"
weekdays = [0.3, 0.3, 0.5, 0.8, 1.5, 2.5, 1.5]
months   = [0.6, 0.6, 0.8, 1.0, 1.4, 1.7, 1.2, 0.5, 1.3, 1.0, 0.9, 1.9]
lumpy    = true

[activities.traiteur_sucre]
name     = "Pâtisserie et traiteur sucré"
weekdays = [0.0, 0.8, 0.8, 0.9, 1.0, 1.4, 1.5]
