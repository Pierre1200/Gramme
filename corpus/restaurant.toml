#           entre deux points. C'est « l'histoire » que le rapport doit raconter :
#           les hausses des dernières semaines tombent dans la fenêtre de
#           42 jours de `price_drift`. Ce scénario est inventé : seul le prix
#           d'arrivée est réel (voir `price`, plus bas).
