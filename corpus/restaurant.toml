#  D'où viennent les prix
# =============================================================================
# Chaque produit nomme sa source (`src`). Les cotations RNM sont celles du
# Réseau des Nouvelles des Marchés (FranceAgriMer), en euros hors taxes :
# stade grossistes sur les marchés de gros, ou prix moyen livré au carton
# complet pour les indicateurs mensuels. Reproduction autorisée sous réserve de
# mentionner la source : FranceAgriMer / RNM.
