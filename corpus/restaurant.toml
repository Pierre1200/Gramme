# =============================================================================
#  Les recettes
# =============================================================================
# Une sous-recette EST une recette : sans `activity`, elle n'est pas vendue.
#
#   batch     ce que produit la recette (quantité, unité) — yield_qty, yield_unit
#   portions  nombre de portions vendues dans ce batch
#   price_ttc prix de vente d'UNE portion
#   vat       10 = consommé sur place ou livré prêt à servir ; 5.5 = vitrine
#   per_week  portions vendues par semaine moyenne
#
# Un composant : `ingredient` OU `recipe`, une quantité NETTE et son unité.
# `yield` est le rendement (parage, épluchage) : le coût se calcule sur le brut,
# qty / yield. L'eau n'est pas comptée.
#
# Limite connue (CLAUDE.md, coproduits) : jaunes et blancs sont comptés chacun
# sur un œuf entier, comme le jus du citron sur le citron entier.

# ----------------------------------------------------------------- sous-recettes

